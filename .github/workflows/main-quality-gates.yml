name: MoovX Main Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Gate A - Main Fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Check diff and lint changed sources
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) candidate="$PR_BASE_SHA" ;;
            push) candidate="$PUSH_BASE_SHA" ;;
            *) exit 1 ;;
          esac
          [[ "$candidate" =~ ^[0-9a-fA-F]{40}$ ]]
          git cat-file -e "${candidate}^{commit}"
          git merge-base --is-ancestor "$candidate" HEAD
          git diff --check "$candidate"...HEAD
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "$candidate"...HEAD -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx')
          if (( ${#files[@]} > 0 )); then
            npx eslint -- "${files[@]}"
          fi
      - run: npx tsc --noEmit
      - run: npm run i18n:check

  standard:
    name: Gate B - Main Standard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:55321'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'public-anon-synthetic-build'
      # Inert placeholder required by eager server module initialization.
      SUPABASE_SERVICE_ROLE_KEY: 'synthetic-service-role-build-only'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm test
      - run: npm run build
